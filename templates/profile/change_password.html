{% extends "base.html" %}

{% block title %}Change Password - AIRBook{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-logo">
                ✈
            </div>

            <div class="auth-eyebrow">
                AIRBOOK ACCOUNT
            </div>

            <h1>Change Password</h1>

            <p>
                Update your AirBook account password.
            </p>

        </div>


        <form method="POST" class="auth-form">

            <div class="form-group">

                <label for="current_password">
                    Current Password
                </label>

                <input
                    type="password"
                    id="current_password"
                    name="current_password"
                    placeholder="Enter current password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="new_password">
                    New Password
                </label>

                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >

            </div>


            <button type="submit" class="auth-submit">
                CHANGE PASSWORD
            </button>

        </form>


        <div class="auth-footer">

            <a href="{{ url_for('profile') }}">
                ← Back to Profile
            </a>

        </div>

    </div>

</div>

{% endblock %}
