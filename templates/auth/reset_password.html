{% extends "base.html" %}

{% block title %}Reset Password - SkyBook{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-logo">
                ✈
            </div>

            <div class="auth-eyebrow">
                SKYBOOK SECURITY
            </div>

            <h1>Reset Password</h1>

            <p>
                Enter the OTP sent to your email and create a new password.
            </p>

        </div>


        <form method="POST" class="auth-form">

            <div class="form-group">

                <label for="otp">
                    Verification OTP
                </label>

                <input
                    type="text"
                    id="otp"
                    name="otp"
                    placeholder="Enter 6-digit OTP"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >

            </div>


            <button type="submit" class="auth-submit">
                RESET PASSWORD
            </button>

        </form>


        <div class="auth-footer">

            <p>Remember your password?</p>

            <a href="{{ url_for('login') }}">
                Back to Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
